<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games by Genre</title>
  <meta name="description" content="Games grouped by genre.">
  <meta name="theme-color" content="#0b0e13">
  <meta property="og:title" content="Games by Genre">
  <meta property="og:description" content="Games grouped by genre.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg?v=2" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Page cover: write the closed shutters and loading card into the page right here, at the end of <head>.
    // Writing them creates the page body together with them, so they exist from the very first frame the
    // browser can draw (a snippet inside <body> can still miss one frame in Firefox-based browsers).
    // Arriving through a transition, they continue it; on any other load (typed URL, refresh, link from
    // another site) they are the loading screen ("boot"). main.js takes over in transitions().
    // This must stay the last thing in <head>. Keep the 6 shutters in step with WIPE.cols in main.js.
    (function () { try {
      var wp = JSON.parse(sessionStorage.getItem("wipe"));
      if (!wp && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      document.write("<div class=\"wipe hold" + (wp ? "" : " boot") + "\" aria-hidden=\"true\">" + "<i></i>".repeat(6) + "<div class=\"wipe-hud\"><small></small><b></b><span class=\"wipe-bar\"></span></div></div>");
      if (!wp) return;
      var hud = document.querySelector(".wipe-hud");
      hud.children[0].textContent = wp.k || "";
      hud.children[1].textContent = wp.t || "";
    } catch (e) {} })();
  </script>
</head>
<body data-page="genre">
  <main id="app"></main>
  <noscript><p style="padding:40px;color:#e8eaef;font-family:system-ui,sans-serif">This portfolio needs JavaScript turned on.</p></noscript>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/bg.js"></script>
</body>
</html>
